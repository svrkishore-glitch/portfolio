name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax and JSON data files
        run: |
          python -m py_compile scripts/sync.py
          python -c "import glob, json; [json.load(open(p, encoding='utf-8-sig')) for p in glob.glob('data/*.json') + ['scripts/config.json']]"
      - name: Check JavaScript syntax
        run: node --check js/main.js
